name: Research repository checks
on: [push, pull_request]
jobs:
  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research entry points
        run: python -m compileall -q src scripts
      - name: Verify public aggregate cohort snapshot
        run: python scripts/verify_public_snapshot.py
