name: Research repository checks
on: [push, pull_request]
jobs:
  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research entry points
        run: python -m compileall -q src scripts
      - name: Verify public aggregate cohort snapshot
        run: python scripts/verify_public_snapshot.py
      - name: Verify public ordinal diagnostic snapshot
        run: python scripts/verify_public_ordinal.py
      - name: Verify public fixed-eight repeated snapshot
        run: python scripts/verify_public_ordinal_repeated.py
      - name: Public ordinal snapshot tamper and boundary tests
        run: python -m unittest discover -s tests -p "test_public_ordinal_snapshot.py" -v
      - name: Public repeated-evaluation snapshot tamper and boundary tests
        run: python -m unittest discover -s tests -p "test_public_ordinal_repeated_snapshot.py" -v
      - name: Install modeling test dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-modeling.txt
      - name: Counterfactual leakage and input-boundary tests
        run: python -m unittest discover -s tests -p "test_pilot*_integrity.py" -v
      - name: Formal resume, repeated-fold and paired-bootstrap contracts
        run: python -m unittest discover -s tests -p "test_formal*.py" -v
      - name: Ordinal representation and full-pipeline null-control contracts
        run: python -m unittest discover -s tests -p "test_ordinal*.py" -v
      - name: Existing OOF paired path decomposition
        run: python -m unittest discover -s tests -p "test_oof_decomposition.py" -v
