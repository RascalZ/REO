   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="342" y="24.253429" transform="rotate(-0 342 24.253429)">Study design and evaluation boundaries</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="87.552" y="62.440142" transform="rotate(-0 87.552 62.440142)">Development data</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(44.027281 88.681176)">GDSC2 continuous AUC</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(42.076109 96.742644)">626 independent groups</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(38.927062 104.804111)">4,967 drug–model records</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(38.729922 112.865579)">8 prespecified compounds</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="87.552" y="186.403981" transform="rotate(-0 87.552 186.403981)">Expression input</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(58.702984 212.645016)">CCLE gene TPM</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(35.090625 220.706484)">Shared by development and</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(52.588734 228.767951)">external prediction</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(36.049734 236.829419)">No expression-platform test</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="268.344" y="62.440142" transform="rotate(-0 268.344 62.440142)">Nested development</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(221.942531 88.681176)">5 outer folds × 3 repeats</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(245.251953 96.742644)">3 inner folds</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(215.893031 104.804111)">Grouped by cell-line identity</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(218.311906 112.865579)">All selection inside training</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="268.344" y="186.368825" transform="rotate(-0 268.344 186.368825)">Eight model arms</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(211.228719 212.645016)">Tissue reference + 2,000-gene</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(231.713422 220.706484)">expression baseline</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(215.390062 228.767951)">2 candidate rules × 3 forms:</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(213.399 236.829419)">expression / rank / gene pairs</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="445.788" y="62.440142" transform="rotate(-0 445.788 62.440142)">Development readout</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(404.369391 88.681176)">Out-of-fold predictions</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(387.277703 96.742644)">Drug-wise Spearman and RMSE</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(390.654531 104.804111)">Paired contrasts and intervals</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(402.913672 112.865579)">Zero solutions retained</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="596.448" y="62.440142" transform="rotate(-0 596.448 62.440142)">Final model audit</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(556.039953 88.681176)">64 models / 1,744 fits</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(549.580563 96.742644)">Independent reload audit</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(564.190359 104.804111)">9,480 predictions</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(541.245156 112.865579)">made before response access</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="596.448" y="186.403981" transform="rotate(-0 596.448 186.403981)">Locked CTRPv2</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(544.0375 212.645016)">175 non-overlapping groups</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(542.837313 220.706484)">1,185 drug–model responses</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(539.646641 228.767951)">One-time cross-screen ranking</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(540.614422 236.829419)">Same CCLE expression source</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b84a4a" x="596.448" y="274.63246" transform="rotate(-0 596.448 274.63246)">Retrospective screen transfer; not clinical or cross-platform validation</text>
   </g>
