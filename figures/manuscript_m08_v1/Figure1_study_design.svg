   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="120.472441" y="33.179375" transform="rotate(-0 120.472441 33.179375)">Development data</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(64.596113 63.112745)">GDSC2 continuous AUC</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(62.09123 73.173186)">626 independent groups</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(58.048535 83.233627)">4,967 drug–model records</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(57.795449 93.294067)">8 prespecified compounds</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="361.417323" y="33.179375" transform="rotate(-0 361.417323 33.179375)">Expression input</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(324.381424 68.142966)">CCLE gene TPM</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(276.977167 78.203406)">Shared development/external input</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(295.299549 88.263847)">No expression-platform test</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="120.472441" y="140.819375" transform="rotate(-0 120.472441 140.819375)">Nested development</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(60.902988 175.782966)">5 outer folds × 3 repeats</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(51.480175 185.843406)">3 inner folds; cell-line groups</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(55.897675 195.903847)">All selection within training</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="361.417323" y="140.780312" transform="rotate(-0 361.417323 140.780312)">Eight model arms</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(298.735135 175.782966)">Tissue + expression 2,000</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(295.036073 185.843406)">2 candidate rules × 3 forms</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(290.718026 195.903847)">Expression / rank / gene pairs</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="120.472441" y="248.459375" transform="rotate(-0 120.472441 248.459375)">Development readout</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(67.299902 283.422966)">Out-of-fold predictions</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(66.293496 293.483406)">Spearman ρ and RMSE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(46.642597 303.543847)">Paired intervals; zeros retained</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="361.417323" y="248.459375" transform="rotate(-0 361.417323 248.459375)">Final model audit</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(309.542128 283.422966)">64 models / 1,744 fits</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(301.249667 293.483406)">Independent reload audit</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(277.654042 303.543847)">9,480 predictions before responses</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="240.944882" y="356.099375" transform="rotate(-0 240.944882 356.099375)">Locked CTRPv2 cross-screen evaluation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(101.726835 391.062966)">175 non-overlapping groups; 1,185 drug–model responses</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(92.268398 401.123406)">One-time retrospective ranking; same CCLE expression source</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #17324d" transform="translate(120.372069 411.183847)">Not clinical or cross-expression-platform validation</text>
